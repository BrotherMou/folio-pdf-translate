[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-pdf-translate"
version = "0.1.0"
description = "Standalone layout-preserving bilingual PDF translation, CLI and MCP"
requires-python = ">=3.11"
dependencies = ["mcp==1.28.1", "PyMuPDF==1.28.2"]

[project.scripts]
folio-pdf-translate = "server.__main__:main"

[tool.setuptools]
packages = ["server"]

[tool.setuptools.package-data]
server = ["pdf_hover.js"]
